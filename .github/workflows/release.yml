name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate manifests & run tests
        run: |
          python scripts/validate_manifests.py
          python -m unittest discover -s tests -v

      - name: Package portable skill bundle
        run: |
          mkdir -p dist
          tar -czf "dist/codebase-ast-rag-indexer-${{ github.ref_name }}.tar.gz" \
            plugin.json .antigravity-plugin .claude-plugin .codex-plugin \
            skills rules assets README.md LICENSE
          zip -rq "dist/codebase-ast-rag-indexer-${{ github.ref_name }}.zip" \
            plugin.json .antigravity-plugin .claude-plugin .codex-plugin \
            skills rules assets README.md LICENSE
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
